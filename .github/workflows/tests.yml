name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # php-version: ['8.3', '8.4', '8.5']
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

        # Add this step to ensure Wayfinder can read your routes cleanly
      - name: Clear Laravel Route Cache
        run: php artisan route:clear

      # Force-generate the files manually first so we can catch any boot errors
      - name: Generate Wayfinder Routes
        run: php artisan wayfinder:generate --with-form

      - name: Build Assets
        run: npm run build

      # did not have any test prepared
      # - name: Tests
      #   run: ./vendor/bin/phpunit
